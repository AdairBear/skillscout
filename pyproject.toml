[project]
name = "skillscout"
version = "0.1.0"
description = "Find and vet agent skills against your own interests. Static vetting only; never runs candidate code."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pyyaml==6.0.3"]

[project.scripts]
skillscout = "skillscout.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillscout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
